<meta name="theme-color" content="#0b0a12">

<style>
/* Layout: one-screen phone game. A procedurally drawn pixel-art crypt fills the screen behind chunky pixel panels.
   One committed dark look; every scene is lit by torches with dithered light. */
:root{
  color-scheme: dark;
  --p:3px;
  --k:#0b0a12; --ink:#16131f; --sh:#211c2d; --st0:#342c45; --st1:#4a3f5c; --st2:#6a5c7e; --st3:#8f82a3;
  --bone0:#6d5638; --bone1:#a88c62; --bone2:#d9c49a; --bone3:#f4e9cf;
  --red0:#4a0f1a; --red1:#8e1f2a; --red2:#d23b35; --red3:#ff7a5c;
  --org0:#9a3f10; --org:#e8741f; --org2:#ffa640; --yel:#ffd35c;
  --grn2:#5fb843; --grn3:#b0e86a; --tea2:#3fb0c9; --tea3:#9eeaf0; --pur2:#a655dc; --pur3:#dca8ff;
  --blu2:#4f8cff; --gld2:#e8b52a; --gld3:#ffe27a;
  --wd0:#2b170e; --wd1:#512e19; --wd2:#7a4726; --wd3:#a86a3a;
  --f-title:'Jacquarda Bastarda 9', 'Pixelify Sans', Georgia, serif;
  --f-px:'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
html{overflow:hidden}
body{margin:0;overflow:hidden;background:var(--k);color:var(--bone3);font-family:var(--f-px);font-size:17px;line-height:1.25;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
button:focus-visible{outline:var(--p) solid var(--yel);outline-offset:var(--p)}
img,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
.pi{display:inline-block;vertical-align:middle;flex:none}

#bg,#fxc{position:fixed;left:0;top:0;pointer-events:none}
#bg{z-index:0}
#fxc{z-index:6}
#fx{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
#flash{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;
  background:repeating-conic-gradient(rgba(210,40,50,.55) 0 25%,rgba(120,10,20,.35) 0 50%) 0 0/6px 6px}
#flash.on{animation:flash .4s steps(4) forwards}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
#wipe{position:fixed;inset:0;background:var(--k);pointer-events:none;z-index:9;opacity:0}
#wipe.on{animation:wipe .36s steps(4) forwards}
@keyframes wipe{0%{opacity:1}100%{opacity:0}}

#app{position:relative;z-index:1;max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding-inline:16px}
#app.shake{animation:shake .36s steps(6)}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-3px,3px)}80%{transform:translate(3px,0)}}
#main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-block:6px 16px;display:flex;flex-direction:column;scrollbar-width:none}
#main::-webkit-scrollbar{display:none}

/* ---------- pixel frames ---------- */
.pf{--bgc:var(--sh);--rim:var(--st1);--lo:var(--ink);
  background:var(--bgc);margin:var(--p);
  box-shadow:0 calc(-1*var(--p)) 0 0 var(--k),0 var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 0 var(--k),var(--p) 0 0 0 var(--k),
    inset 0 0 0 var(--p) var(--rim),inset 0 calc(-2*var(--p)) 0 0 var(--lo)}
.pf.parch{--bgc:#e9d9b4;--rim:#b89a68;--lo:#cdb88c;color:#2b2016}
.pf.dark{--bgc:rgba(14,11,20,.92);--rim:var(--st0);--lo:rgba(0,0,0,.4)}

.pb{--bgc:var(--st1);--hi:var(--st2);--lo:var(--st0);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 16px;margin:var(--p) var(--p) calc(var(--p)*2);
  background:var(--bgc);color:var(--bone3);font-family:var(--f-px);font-weight:700;font-size:19px;letter-spacing:.02em;text-shadow:0 2px 0 rgba(0,0,0,.45);
  box-shadow:0 calc(-1*var(--p)) 0 0 var(--k),0 var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 0 var(--k),var(--p) 0 0 0 var(--k),0 calc(2*var(--p)) 0 0 var(--k),
    inset 0 var(--p) 0 0 var(--hi),inset 0 calc(-1*var(--p)) 0 0 var(--lo)}
.pb:active:not(:disabled){transform:translateY(var(--p));box-shadow:0 calc(-1*var(--p)) 0 0 var(--k),0 var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 0 var(--k),var(--p) 0 0 0 var(--k),inset 0 var(--p) 0 0 var(--lo)}
.pb.go{--bgc:var(--org2);--hi:var(--yel);--lo:var(--org);color:#2a1206;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.pb.big{min-height:60px;font-size:23px;width:calc(100% - 2*var(--p))}
.pb.sm{min-height:40px;font-size:16px;align-self:center}
.pb:disabled{--bgc:var(--st0);--hi:var(--st1);--lo:var(--sh);color:var(--st3);text-shadow:none;cursor:default}
.pb.choice{flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;text-align:left;width:calc(100% - 2*var(--p))}
.pb.choice small{font-weight:400;font-size:15px;color:var(--bone2)}
.pb.go.choice small{color:#5a2a08}

/* ---------- type ---------- */
.h-title{font-family:var(--f-title);font-weight:400;font-size:40px;line-height:.95;margin:0;color:var(--bone3);text-wrap:balance;
  text-shadow:0 var(--p) 0 var(--k),var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 var(--k),0 calc(-1*var(--p)) 0 var(--k)}
.h-sec{font-family:var(--f-px);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;margin:0;color:var(--org2)}
.eyebrow{margin:0;font-weight:700;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--org2);text-shadow:0 2px 0 var(--k)}
.sub{margin:0;color:var(--st3);font-size:16px}
.prose{margin:0;font-size:18px;line-height:1.35;max-width:60ch}
.screen{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.screen.fill{flex:1}
.grow{flex:1}
.spacer{flex:none;height:clamp(150px,34vh,270px)}
.spacer.short{height:clamp(70px,14vh,130px)}
.inner{display:flex;flex-direction:column;gap:12px;padding:16px 14px 18px}

/* ---------- hud ---------- */
.hud{display:flex;align-items:center;gap:10px;padding:8px 10px 11px;margin-top:10px}
.hp{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.bar{position:relative;height:18px;flex:1;background:var(--k);box-shadow:inset 0 0 0 var(--p) var(--k)}
.bar i{position:absolute;left:var(--p);top:var(--p);bottom:var(--p);background:var(--red2);box-shadow:inset 0 var(--p) 0 0 var(--red3),inset 0 calc(-1*var(--p)) 0 0 var(--red1);transition:width .4s steps(6)}
.bar::after{content:"";position:absolute;inset:var(--p);background:repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,0,0,.45) 12px 15px);pointer-events:none}
.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;z-index:1;text-shadow:2px 0 0 var(--k),-2px 0 0 var(--k),0 2px 0 var(--k),0 -2px 0 var(--k);font-variant-numeric:tabular-nums}
.stat{display:flex;align-items:center;gap:3px;font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 var(--k)}
.stat.gold{color:var(--gld3)}
.stat.pblock{color:var(--tea3)}
.floorlbl{font-weight:700;font-size:15px;color:var(--bone2);white-space:nowrap}
.snd{width:32px;height:32px;display:grid;place-items:center;flex:none}
.relics{display:flex;gap:6px;flex-wrap:wrap;padding:4px 3px 2px}
.relic{width:36px;height:36px;display:grid;place-items:center;background:var(--k);box-shadow:inset 0 0 0 var(--p) var(--rc,var(--st1))}

/* ---------- title ---------- */
.title-screen{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-top:18px}
.logo{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.logo b{font-family:var(--f-title);font-weight:400;font-size:clamp(64px,21vw,96px);line-height:.8;color:var(--bone3);
  text-shadow:0 var(--p) 0 var(--bone1),0 calc(2*var(--p)) 0 var(--bone0),0 calc(3*var(--p)) 0 var(--k),var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 var(--k),0 calc(-1*var(--p)) 0 var(--k),var(--p) calc(2*var(--p)) 0 var(--k),calc(-1*var(--p)) calc(2*var(--p)) 0 var(--k)}
.logo span{font-family:var(--f-px);font-weight:700;font-size:18px;letter-spacing:.34em;text-transform:uppercase;color:var(--org2);text-shadow:0 var(--p) 0 var(--k)}
.gate-spot{flex:1;min-height:170px;width:100%;display:flex;align-items:flex-start;justify-content:center;padding-top:6%}
.tdice{display:flex;gap:10px}
.tdice .dw{width:66px;height:66px;animation:hover 2.4s steps(6) infinite}
.tdice .dw:nth-child(2){animation-delay:-.8s}
.tdice .dw:nth-child(3){animation-delay:-1.6s}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.menu{width:min(100%,340px);display:flex;flex-direction:column;gap:4px;padding:12px 12px 14px}
.records{display:flex;justify-content:center;gap:14px;font-size:14px;color:var(--st3);padding-top:4px}
.records b{color:var(--bone3)}

/* ---------- map ---------- */
.floorbar{padding:10px 12px 14px;display:flex;flex-direction:column;gap:8px}
.track{display:flex;align-items:center;justify-content:space-between;position:relative;padding:2px 0}
.track::before{content:"";position:absolute;left:6px;right:6px;top:50%;height:var(--p);margin-top:-1px;background:var(--st0)}
.node{position:relative;width:12px;height:12px;background:var(--st0);box-shadow:inset 0 0 0 var(--p) var(--st1)}
.node.done{background:var(--bone1);box-shadow:inset 0 0 0 var(--p) var(--bone0)}
.node.here{width:18px;height:18px;background:var(--org2);box-shadow:inset 0 0 0 var(--p) var(--yel),0 0 0 var(--p) var(--k);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{background:var(--org)}}
.node.boss{width:auto;height:auto;background:none;box-shadow:none}
.fl-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.doors{display:flex;justify-content:center;gap:12px;align-items:flex-start}
.maprow{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.door{display:flex;flex-direction:column;align-items:center;gap:2px;width:96px;transition:transform .1s steps(2)}
.door img{width:93px;height:141px}
.door:active{transform:translateY(var(--p))}
.door b{font-family:var(--f-title);font-weight:400;font-size:26px;line-height:1;margin-top:4px;color:var(--bone3);text-shadow:0 var(--p) 0 var(--k),2px 0 0 var(--k),-2px 0 0 var(--k)}
.door small{display:block;min-height:2.35em;font-size:13px;line-height:1.15;color:var(--bone2);text-align:center;text-shadow:0 2px 0 var(--k),2px 0 0 var(--k),-2px 0 0 var(--k)}
.door.open img{animation:dop .38s steps(3) forwards}
@keyframes dop{100%{filter:brightness(2.4);transform:translateY(-6px)}}

/* ---------- combat ---------- */
.combat{flex:1;display:flex;flex-direction:column;gap:6px;min-height:0}
.intent-row{display:flex;justify-content:center;min-height:52px;padding-top:4px}
.bubble{position:relative;display:flex;align-items:center;gap:8px;padding:6px 12px 9px 8px;--rim:var(--ic,var(--st1))}
.bubble::after{content:"";position:absolute;left:50%;bottom:calc(-3*var(--p));width:calc(3*var(--p));height:var(--p);margin-left:calc(-1.5*var(--p));background:var(--k);box-shadow:var(--p) var(--p) 0 0 var(--k)}
.bubble b{font-size:26px;font-weight:700;line-height:1;color:#fff;text-shadow:0 2px 0 var(--k)}
.bubble span{font-size:14px;color:var(--bone2);max-width:170px;line-height:1.1}
.foe-spot{flex:1;min-height:120px}
.plate{align-self:center;width:min(100%,290px);display:flex;flex-direction:column;align-items:center;gap:5px;padding:6px 10px 11px}
.plate .nm{font-family:var(--f-title);font-size:28px;line-height:.9;color:var(--bone3);text-shadow:0 2px 0 var(--k)}
.plate .bar{width:100%;flex:none}
.plate .bar i{background:var(--pur2);box-shadow:inset 0 var(--p) 0 0 var(--pur3),inset 0 calc(-1*var(--p)) 0 0 #6a2c9c}
.eblock{position:absolute;right:-6px;top:50%;transform:translateY(-50%);z-index:2;display:flex;align-items:center;gap:1px;font-weight:700;font-size:14px;color:#fff;padding:0 5px 0 1px;background:#1f6f86;box-shadow:0 0 0 var(--p) var(--k);text-shadow:0 2px 0 var(--k)}
.log{margin:0;min-height:21px;text-align:center;font-size:16px;color:var(--bone2);text-shadow:0 2px 0 var(--k),2px 0 0 var(--k),-2px 0 0 var(--k)}
.sum{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;min-height:40px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:3px;padding:2px 9px 5px 5px;--rim:var(--cc)}
.chip b{font-size:21px;font-weight:700;color:#fff;line-height:1;text-shadow:0 2px 0 var(--k)}
.chip i{font-style:normal;font-weight:700;font-size:13px;color:#fff;background:#6a2c9c;padding:0 4px;margin-left:2px}
.chip.combo{--rim:var(--org2);font-weight:700;font-size:15px;color:var(--yel);padding:4px 10px 7px;animation:blink2 .6s steps(2) infinite}
@keyframes blink2{50%{color:#fff}}
.hint{font-size:15px;color:var(--bone2);text-shadow:0 2px 0 var(--k),2px 0 0 var(--k),-2px 0 0 var(--k)}
.tray{--dk:3;display:flex;justify-content:center;flex-wrap:wrap;gap:8px 10px;padding:18px 12px 28px;margin:var(--p);
  background:repeating-conic-gradient(#3b0d17 0 25%,#330b14 0 50%) 0 0/6px 6px;
  box-shadow:0 calc(-1*var(--p)) 0 0 var(--k),0 var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 0 var(--k),var(--p) 0 0 0 var(--k),
   inset 0 0 0 var(--p) var(--wd3),inset 0 0 0 calc(2*var(--p)) var(--wd1),inset 0 0 0 calc(3*var(--p)) var(--wd0),inset 0 calc(6*var(--p)) 0 0 rgba(0,0,0,.35)}
.die{position:relative;width:calc(22px*var(--dk));height:calc(22px*var(--dk));flex:none}
.die .dw{width:100%;height:100%}
.die.held .dw{transform:translateY(-9px);filter:drop-shadow(var(--p) 0 0 var(--org2)) drop-shadow(calc(-1*var(--p)) 0 0 var(--org2)) drop-shadow(0 var(--p) 0 var(--org2)) drop-shadow(0 calc(-1*var(--p)) 0 var(--org2))}
.die .lock{position:absolute;left:50%;bottom:-20px;transform:translateX(-50%);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--org2);opacity:0;text-shadow:0 2px 0 var(--k)}
.die.held .lock{opacity:1}
.die.rolling .dw{animation:tumble .36s infinite;animation-timing-function:steps(1,end)}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}25%{transform:translateY(-18px) rotate(90deg)}50%{transform:translateY(-24px) rotate(180deg)}75%{transform:translateY(-9px) rotate(270deg)}100%{transform:translateY(0) rotate(360deg)}}
.die.land .dw{animation:land .3s steps(3)}
@keyframes land{0%{transform:translateY(-9px)}50%{transform:translateY(3px)}100%{transform:none}}
.die.pop .dw{animation:pop .26s steps(2)}
@keyframes pop{50%{transform:translateY(-12px);filter:brightness(1.4)}}
.actions{display:flex;gap:4px}
.actions .pb{flex:1}
.pips{display:inline-flex;gap:3px}
.pips span{width:9px;height:9px;background:currentColor}
.pips span.off{background:none;box-shadow:inset 0 0 0 var(--p) currentColor;opacity:.5}

/* ---------- cards ---------- */
.choices,.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.card{--rim:var(--bone0);--bgc:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 14px;text-align:center}
.card.r-rare{--rim:var(--blu2)}
.card.r-epic{--rim:var(--pur2);--bgc:#2a1838}
.card.r-relic{--rim:var(--org2)}
.card:active:not(:disabled){transform:translateY(var(--p))}
.card .rar{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--rim)}
.card.r-common .rar{color:var(--bone2)}
.card b{font-size:16px;font-weight:700;line-height:1.1}
.card small{font-size:13px;color:var(--bone2);line-height:1.15}
.card:disabled{opacity:.35}
.card .dimg{width:66px;height:66px}
.die-net{display:grid;grid-template-columns:repeat(3,auto);gap:3px}
.die-net .dw{width:22px;height:22px}
.price{display:inline-flex;align-items:center;gap:2px;font-weight:700;color:var(--gld3)}
.price.poor{color:var(--red3)}
.loot{display:flex;align-items:center;gap:10px;padding:10px 12px 13px}
.loot b{font-size:26px;font-weight:700;line-height:1;color:var(--gld3)}
.loot span{color:var(--bone2)}
.loot.rel{--rim:var(--org2)}
.loot.rel div{display:flex;flex-direction:column;gap:2px;min-width:0}
.loot.rel b{font-family:var(--f-title);font-weight:400;font-size:26px;color:var(--bone3)}

/* ---------- forge ---------- */
.newface{display:flex;align-items:center;gap:14px;padding:10px 12px 13px}
.newface .dw{width:66px;height:66px}
.newface div{display:flex;flex-direction:column}
.newface b{font-size:20px}
.newface span{color:var(--bone2);font-size:14px}
.dice-list{display:flex;flex-direction:column;gap:6px}
.dice-row{display:flex;flex-direction:column;gap:6px;padding:8px 10px 13px}
.dlabel{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--st3)}

  text-shadow:var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 var(--k),0 var(--p) 0 var(--k),0 calc(-1*var(--p)) 0 var(--k),var(--p) var(--p) 0 var(--k);
  animation:floatup 1s steps(10) forwards}
.float.dmg{color:var(--red3)}.float.big{font-size:44px;color:var(--yel)}.float.def{color:var(--tea3)}.float.heal{color:var(--grn3)}.float.coin{color:var(--gld3)}.float.small{font-size:20px;color:var(--bone2)}
@keyframes floatup{0%{opacity:1;transform:translate(-50%,-30%)}20%{transform:translate(-50%,-90%)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-200%)}}
.banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-title);font-size:clamp(46px,15vw,72px);line-height:1;color:var(--yel);white-space:nowrap;
  text-shadow:0 var(--p) 0 var(--org0),0 calc(2*var(--p)) 0 var(--k),var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 var(--k),0 calc(-1*var(--p)) 0 var(--k);animation:banner 1.2s steps(12) forwards}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:8;width:max-content;max-width:calc(100% - 40px);padding:9px 14px 12px;font-size:16px;text-align:center}

#toast b{color:var(--org2)}
#sheet{position:fixed;inset:0;z-index:8;background:rgba(5,4,8,.75);display:flex;align-items:flex-end;justify-content:center;padding:16px}
#sheet[hidden]{display:none!important}
.sheet-card{width:min(100%,450px);max-height:86%;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:16px 14px 18px;scrollbar-width:none}
.sheet-card>*{flex-shrink:0}
.sheet-card::-webkit-scrollbar{display:none}
.how{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:16px;line-height:1.3}
.how li{display:flex;gap:10px;align-items:flex-start}
.statlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:min(100%,340px)}

/* ---------- dice skins ---------- */
.dw{position:relative;display:inline-block;flex:none;width:66px;height:66px;vertical-align:middle}
.dw img{position:absolute;inset:0;width:100%;height:100%;display:block}
.dw.sweep::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,transparent 40%,var(--sw1) 47%,var(--sw2) 53%,transparent 60%) 0 0/300% 100% no-repeat;
  -webkit-mask:var(--m) 0 0/100% 100%;mask:var(--m) 0 0/100% 100%;animation:sweep var(--swt,3s) steps(14) infinite}
@keyframes sweep{0%{background-position:100% 0}55%,100%{background-position:0% 0}}
@keyframes lava{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes twinkle{50%{opacity:0}}
@keyframes eyeblink{0%,86%,100%{opacity:1}90%,94%{opacity:0}}
@keyframes zapfl{0%,100%{opacity:0}6%{opacity:1}9%{opacity:.1}12%{opacity:1}16%{opacity:0}62%{opacity:0}65%{opacity:1}68%{opacity:0}}
@keyframes nebula{50%{filter:hue-rotate(55deg) brightness(1.15)}}
.sk-gold{--sw1:rgba(255,255,230,.95);--sw2:rgba(255,226,120,.7);filter:drop-shadow(0 0 4px rgba(255,210,80,.55))}
.sk-gold .g{animation:twinkle 1.4s steps(2) infinite}
.sk-crystal{--sw1:rgba(255,255,255,.9);--sw2:rgba(190,240,255,.7);--swt:2.8s;filter:drop-shadow(0 0 4px rgba(120,210,255,.65))}
.sk-crystal .g{animation:twinkle 1.3s steps(2) infinite}
.sk-jade{filter:drop-shadow(0 0 4px rgba(120,255,120,.45))}
.sk-jade .g{animation:lava 1.4s steps(4) infinite}
.sk-obsidian{filter:drop-shadow(0 0 5px rgba(255,90,20,.6))}
.sk-obsidian .g{animation:lava 1.8s steps(5) infinite}
.sk-shadow{filter:drop-shadow(0 0 6px rgba(160,60,220,.6))}
.sk-shadow .g{animation:eyeblink 4.2s steps(1) infinite}
.sk-storm{filter:drop-shadow(0 0 4px rgba(140,210,255,.55))}
.sk-storm .g{animation:zapfl 2.6s steps(1) infinite}
.sk-celestial{--sw1:rgba(255,255,255,.85);--sw2:rgba(220,180,255,.6);--swt:3.4s;filter:drop-shadow(0 0 6px rgba(200,160,255,.7))}
.sk-celestial .b{animation:nebula 6s steps(12) infinite}
.sk-celestial .g{animation:twinkle 1.1s steps(2) infinite}
.skins{display:flex;flex-direction:column;gap:6px}
.skin{display:flex;align-items:center;gap:12px;padding:10px 12px 14px;text-align:left;--rim:var(--st1)}

.skin .trio{display:flex;gap:4px;flex:none}
.skin .trio .dw{width:44px;height:44px}
.skin .txt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}

.skin small{font-size:13px;color:var(--bone2);line-height:1.2}
.skin .rar{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--st3)}
.skin .rar.leg{color:var(--org2);animation:blink2 .8s steps(2) infinite}
.skin em{font-style:normal;font-size:12px;font-weight:700;color:var(--org2);white-space:nowrap}
.hudbtn{width:34px;height:34px;display:grid;place-items:center;flex:none;background:var(--st1);box-shadow:0 0 0 var(--p) var(--k),inset 0 var(--p) 0 0 var(--st2),inset 0 calc(-1*var(--p)) 0 0 var(--st0)}
.hudbtn:active{transform:translateY(2px)}
.pausebars{display:flex;gap:4px}
.pausebars i{width:5px;height:14px;background:var(--bone3);box-shadow:0 2px 0 var(--k)}
.pmenu{display:flex;flex-direction:column;gap:2px}

/* ---------- merchant ---------- */
.spacer{position:relative}
.say{position:absolute;left:0;top:8px;max-width:50%;padding:8px 12px 11px;font-size:15px;line-height:1.2}
.say::after{content:"";position:absolute;right:calc(-3*var(--p));top:14px;width:var(--p);height:calc(2*var(--p));background:var(--k);box-shadow:var(--p) var(--p) 0 0 var(--k)}
.board{position:relative;display:flex;flex-direction:column;gap:12px;padding:16px 14px 18px;margin:var(--p);
  background:repeating-linear-gradient(180deg,#5a331c 0 21px,#4a2a17 21px 24px,#2b170e 24px 27px);
  box-shadow:0 calc(-1*var(--p)) 0 0 var(--k),0 var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 0 var(--k),var(--p) 0 0 0 var(--k),
    inset 0 0 0 var(--p) var(--wd3),inset 0 0 0 calc(2*var(--p)) var(--wd1),inset 0 0 0 calc(3*var(--p)) var(--wd0)}
.sign{align-self:center;position:relative;margin-top:16px;padding:8px 20px 12px;background:#e9d9b4;color:#3a2412;font-family:var(--f-title);font-size:32px;line-height:1;text-align:center;
  box-shadow:0 calc(-1*var(--p)) 0 0 var(--k),0 var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 0 var(--k),var(--p) 0 0 0 var(--k),inset 0 0 0 var(--p) #b89a68,inset 0 calc(-2*var(--p)) 0 0 #cdb88c}
.sign::before,.sign::after{content:"";position:absolute;top:-19px;width:var(--p);height:16px;background:repeating-linear-gradient(#8f82a3 0 3px,#342c45 3px 6px)}
.sign::before{left:22%}
.sign::after{right:22%}
.purse{align-self:center;display:flex;align-items:center;gap:6px;font-size:16px;color:var(--bone2);text-shadow:0 2px 0 var(--k)}
.purse b{color:var(--gld3);font-size:21px}
.wares{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:14px 8px}
.ware{--wr:#b89a68;position:relative;display:flex;flex-direction:column;align-items:center;gap:5px;padding:16px 6px 10px;margin:var(--p);text-align:center;color:#2b2016;background:#e9d9b4;
  box-shadow:0 calc(-1*var(--p)) 0 0 var(--k),0 var(--p) 0 0 var(--k),calc(-1*var(--p)) 0 0 0 var(--k),var(--p) 0 0 0 var(--k),0 calc(3*var(--p)) 0 0 rgba(0,0,0,.4),inset 0 0 0 var(--p) var(--wr),inset 0 calc(-2*var(--p)) 0 0 #cdb88c}
.ware.r-rare{--wr:#4f8cff}
.ware.r-epic{--wr:#a655dc}
.ware.r-relic{--wr:#e8741f}
.ware .nail{position:absolute;top:6px;left:50%;width:6px;height:6px;margin-left:-3px;background:#8f82a3;box-shadow:inset -3px -3px 0 0 #342c45}
.ware .rar{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--wr)}
.ware.r-common .rar,.ware.r-potion .rar{color:#7a6440}
.ware .dimg{width:66px;height:66px}
.ware b{font-size:15px;line-height:1.1}
.ware small{font-size:12.5px;color:#6a5236;line-height:1.15}
.ware .tag{margin-top:auto;display:inline-flex;align-items:center;gap:3px;padding:2px 8px 4px;background:#2b170e;color:var(--gld3);font-weight:700;box-shadow:0 0 0 var(--p) var(--k)}
.ware .tag.poor{color:var(--red3)}
.ware:active:not(:disabled){transform:translateY(var(--p))}
.ware:disabled{filter:grayscale(.5) brightness(.75)}
.stamp{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:#c42a22;padding:1px 8px 3px;box-shadow:0 0 0 var(--p) #c42a22;background:rgba(233,217,180,.9)}

/* ---------- armory / equipment ---------- */
.arm-head{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;flex-wrap:wrap}
.bank{display:flex;align-items:center;gap:6px;padding:4px 10px 7px;white-space:nowrap;background:var(--k);box-shadow:inset 0 0 0 var(--p) var(--gld1)}
.skins .skin{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"dice txt" "dice act";column-gap:12px;row-gap:6px;align-items:center}
.skins .skin .trio{grid-area:dice;flex-direction:column;align-self:center}

@keyframes myth{33%{color:#ffe27a}66%{color:#8fd8ff}}

.slots{display:flex;flex-direction:column;gap:4px}

.gbtns{flex-direction:row!important;gap:4px!important}
.gear.locked{opacity:.55}
.gear .gtxt{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.gear .rar{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--st3)}
.gear b{font-size:16px}
.gear small{font-size:13px;color:var(--bone2);line-height:1.2}
.gbtns{display:flex;flex-direction:column;gap:0}
.gear .pb.sm{min-height:36px;font-size:14px;padding:0 10px}
.lootbox{display:flex;align-items:center;gap:12px;padding:8px 14px 13px;--rim:var(--gld2);text-align:left;animation:boxglow 1.2s steps(2) infinite}
.lootbox b{display:block;font-size:18px}
.lootbox small{color:var(--bone2)}
@keyframes boxglow{50%{--rim:var(--yel)}}
.lootbox.shaking img{animation:boxshake .9s steps(9)}
@keyframes boxshake{0%,100%{transform:none}10%{transform:translate(-3px,0) rotate(-6deg)}20%{transform:translate(3px,0) rotate(6deg)}30%{transform:translate(-3px,-3px)}40%{transform:translate(3px,-6px) rotate(-6deg)}50%{transform:translate(-3px,-9px) rotate(6deg)}60%{transform:translate(3px,-12px)}70%{transform:translate(0,-15px) scale(1.1)}90%{filter:brightness(3)}}

/* ---------- equipment doll + drag and drop ---------- */
.doll{display:flex;align-items:center;justify-content:space-around;gap:6px;padding:12px 8px 16px;--bgc:#1a1624}

.card.r-bless{--rc:var(--grn2);--rim:var(--grn2)}

/* ---------- reward cards ---------- */

      [[4,9],[3,8],[3,7],[2,6],[2,5],[1,4],[1,3],[0,2],[0,1]].forEach(([a,b],i)=>{ put(a,b,'#e6d6b0'); put(a+1,b,i<5?'#b8a888':'#e6d6b0'); put(DW-1-a,b,'#e6d6b0'); put(DW-2-a,b,i<5?'#b8a888':'#e6d6b0'); });
      skullAt(DCX-2,0,'#ffe14a');
      for(let a=-9;a<=9;a+=2){ const y=17-Math.round(Math.sqrt(Math.max(0,100-a*a)))+1; put(DCX+a,y,'#e6d6b0'); put(DCX+a,y+1,'#b8a888'); }
      if(!open){ const rr=seeded(666); for(let k=0;k<4;k++){ let X=DCX-6+Math.floor(rr()*12),y=24; for(let i=0;i<14;i++){ put(X,y,rr()<.5?'#d23b35':'#ff5a1a'); y++; X+=rr()<.5?-1:1; } }
        for(let a=0;a<Math.PI*2;a+=.2) put(DCX+Math.cos(a)*5,32+Math.sin(a)*5,'#8e1f2a'); }
      break;
  }
  // outline
  const c=document.createElement('canvas'); c.width=DW; c.height=DH; const x=c.getContext('2d');
  for(let y=0;y<DH;y++) for(let X=0;X<DW;X++){
    let col=get(X,y);
    if(!col&&(get(X-1,y)||get(X+1,y)||get(X,y-1)||get(X,y+1))) col='#0b0a12';
    if(col){ x.fillStyle=col; x.fillRect(X,y,1,1); }
  }
  return doorCache[key]=c.toDataURL();
}

function gearTotal(){ const t={}; for(const s of SLOTS){ const id=META.gear.eq[s]; if(!id) continue; const st=gearStats(id); for(const k in st) t[k]=k==='phoenix'?Math.max(t[k]||0,st[k]):(t[k]||0)+st[k]; } return t; }

const SW={dmg:3,block:2.5,hp:.6,regen:2.5,dodge:.4,thorns:1.5,winHeal:.5,reroll:6,phoenix:.15,dodgeHeal:1};

const sunit=k=>k==='dodge'||k==='phoenix'?'%':'';
function gearScore(id){ const st=gearStats(id); return Object.keys(st).reduce((a,k)=>a+st[k]*(SW[k]||1),0); }
function compareHTML(nid,cid){
  const a=gearStats(nid),b=gearStats(cid),keys=[...new Set([...Object.keys(b),...Object.keys(a)])];
  const rows=keys.map(k=>{ const va=a[k]||0,vb=b[k]||0,d=va-vb; return `<tr class="${d>0?'up':d<0?'down':'eq'}"><td>${SLBL[k]||k}</td><td>${vb}${sunit(k)}</td><td>${va}${sunit(k)}</td><td>${d>0?'▲ +'+d:d<0?'▼ '+d:'='}</td></tr>`; }).join('');
  const diff=gearScore(nid)-gearScore(cid),v=Math.abs(diff)<.5?'eq':diff>0?'up':'down';
  return `<div class="cmp"><div class="cmp-v ${v}">${v==='up'?'▲ Mejor que tu':v==='down'?'▼ Peor que tu':'≈ Parecida a tu'} ${GEAR[cid].name} (Nv ${lvOf(cid)})</div>

function statLines(id,L){ const st=gearStats(id,L); return Object.keys(st).map(k=>STATTXT[k](st[k])); }
function upCost(id){ return QUAL[GEAR[id].q].up*lvOf(id); }
function scrapVal(id){ return Math.round(QUAL[GEAR[id].q].scrap*(1+(lvOf(id)-1)*.5)); }
function applyGear(){
  if(!G||G.over) return;
  const bonus=gearTotal().hp||0,prev=G.gearHp||0;
  if(bonus!==prev){ G.maxHp+=bonus-prev; G.hp=Math.max(1,Math.min(G.maxHp,G.hp+Math.max(0,bonus-prev))); G.gearHp=bonus; }
}
function rollGear(){ let r=Math.random()*DROP_TOTAL; for(const k in GEAR){ r-=GEAR[k].drop; if(r<0) return k; } return 'sh_oak'; }

function lightPass(x){
  const BW=S.BW,BH=S.BH,img=x.getImageData(0,0,BW,BH),d=img.data,amb=S.amb,Ls=S.lights;
  for(let y=0;y<BH;y++) for(let X=0;X<BW;X++){
    const i=(y*BW+X)*4;
    const dx=(X-BW/2)/(BW*.62),dy=(y-BH*.42)/(BH*.72);
    let L=amb*(1-.62*Math.min(1,dx*dx+dy*dy)),tr=0,tg=0,tb=0,tw=0;
    for(const l of Ls){
      const ddx=X-l.x,ddy=(y-l.y)*1.15,dd=ddx*ddx+ddy*ddy;
      if(dd<l.r*l.r){ const v=1-Math.sqrt(dd)/l.r,w=v*v*l.i; L+=w; tr+=w*l.c[0]; tg+=w*l.c[1]; tb+=w*l.c[2]; tw+=w; }
    }
    let k=0; while(k<LEV.length-1&&LEV[k+1]<=L) k++;
    let q=LEV[k];
    if(k<LEV.length-1&&L>LEV[k]){ const f=(L-LEV[k])/(LEV[k+1]-LEV[k]); if(f>BAYER[(y&3)*4+(X&3)]) q=LEV[k+1]; }
    let mr=q,mg=q,mb=q;
    if(tw>0){ const w=Math.min(1,tw); mr*=1+(tr/tw-1)*w; mg*=1+(tg/tw-1)*w; mb*=1+(tb/tw-1)*w; }
    d[i]=Math.min(255,d[i]*mr); d[i+1]=Math.min(255,d[i+1]*mg); d[i+2]=Math.min(255,d[i+2]*mb);
  }
  x.putImageData(img,0,0);
}

function goblinPeek(c,t,g){
  const L=S.gateLeaf; if(!L||REDUCED) return;
  const cyc=t%10000; if(cyc<6000) return;
  const e=(cyc-6000)/1000,ci=Math.floor(t/10000),ease=v=>v<=0?0:v>=1?1:v*v*(3-2*v);
  const o=e<.9?ease(e/.9):e<2.9?1:1-ease((e-2.9)/1.1);
  if(S.peekC!==ci){ S.peekC=ci; if(AC&&SOUND) tone(78,.9,'sawtooth',.012,54); }
  if(e>2.9&&S.peekX!==ci){ S.peekX=ci; if(AC&&SOUND) tone(64,1.1,'sawtooth',.01,44); }
  const open=Math.round(g.r*.85*o),leafX=g.cx+open,leafW=L.w-open,center=g.cx+open/2,gw=34;
  c.save(); c.clip(g.clip);
  c.fillStyle='#07050a'; c.fillRect(g.cx,g.top,L.w,L.h);
  let gx=null;
  if(e>=.6&&e<1.2) gx=leafX+8-(leafX+8-center)*ease((e-.6)/.6);
  else if(e>=1.2&&e<2.5) gx=center;
  else if(e>=2.5&&e<3.05) gx=center+(leafX+gw/2-center)*ease((e-2.5)/.55);
  if(gx!=null){
    const flip=(e>1.45&&e<1.95)||(e>2.2&&e<2.5)?-1:1;
    c.save(); c.translate(Math.round(gx),g.hz-gw+1); c.scale(flip,1); c.drawImage(procSprite('goblin').img,-gw/2,0,gw,gw); c.restore();
    c.globalAlpha=.3; c.fillStyle='#000'; c.fillRect(g.cx,g.top,L.w,L.h); c.globalAlpha=1;
  }
  if(leafW>0){ c.drawImage(L.c,0,0,L.w,L.h,leafX,g.top,leafW,L.h); c.globalAlpha=o*.45; c.fillStyle='#000'; c.fillRect(leafX,g.top,leafW,L.h); c.globalAlpha=1; }
  c.restore();
}

function randomRelic(){const pool=Object.keys(RELICS).filter(r=>!G.relics.includes(r));return pool.length?pick(pool):null}
function gainRelic(r){ if(!r||G.relics.includes(r)) return; G.relics.push(r); if(r==='ember'){G.maxHp+=10;G.hp+=10} }
function maxRerolls(){ let n=2+(has('amulet')?1:0)+(gearTotal().reroll||0); if(G&&G.pact==='luck') n-=1; if(G&&G.pact==='echo') n=1; return Math.max(1,n); }
function genFace(boost=0){
  const r=Math.random()-boost*.12, rar=r<.1?'epic':r<.4?'rare':'common';
  const t=wpick({atk:32,def:26,heal:14,crit:12,coin:10});
  const base={atk:rnd(3,4),def:rnd(3,4),heal:rnd(2,3),crit:rnd(2,3),coin:rnd(3,5)}[t];
  const bonus={common:0,rare:rnd(1,2),epic:rnd(3,4)}[rar];
  return F(t,base+bonus+Math.floor(G.floor/4),rar);
}
function genDie(){ return {faces:[genFace(),genFace(),genFace(),genFace(),F('atk',2),F('blank',0)]} }
const faceName=f=>f.t==='blank'?'Cara vacía':`${TYPES[f.t].name} ${f.v}`;

/* ================= run flow ================= */
function newRun(){
  G={mode:'infinite',screen:'map',hp:32,maxHp:32,gold:10,floor:1,relics:[],over:false,
    dice:[
      {faces:[F('atk',3),F('atk',3),F('atk',4),F('def',3),F('def',2),F('blank',0)]},
      {faces:[F('atk',2),F('atk',2),F('def',3),F('def',3),F('heal',2),F('blank',0)]},
      {faces:[F('atk',2),F('atk',3),F('def',2),F('heal',2),F('coin',3),F('blank',0)]}
    ],
    doors:null,combat:null,reward:null,shop:null,event:null,treasure:null,pending:null,
    stats:{kills:0,dmg:0,rolls:0,crits:0}};
  META.runs++; store('cripta-meta',META);
  G.doors=genDoors(); G.gearHp=0; applyGear(); saveRun();
  if(!META.introSeen) playIntro(()=>{ view='game'; go('map'); }); else { view='game'; go('map'); }
}
function genDoors(){
  const f=G.floor;
  const lc=worldOf(f).local;
  if(lc===WORLD_LEN) return ['boss'];
  if(lc===1) return ['combat','combat'];
  if(lc===WORLD_LEN-1) return ['rest','shop'];
  // special rooms need a few floors of rest between appearances, so they never repeat back to back
  const COOL={rest:4,shop:3,treasure:5,elite:2,event:1};
  G.seen=G.seen||{};
  const ready=t=>f-(G.seen[t]??-99)>COOL[t];
  const w={combat:38,event:ready('event')?18:0,treasure:lc>=3&&ready('treasure')?8:0,shop:lc>=2&&ready('shop')?11:0,rest:lc>=4&&lc<=WORLD_LEN-5&&ready('rest')?10:0,elite:lc>=3&&ready('elite')?14:0};
  const n=Math.random()<.55?3:2,out=[];
  let guard=0;
  while(out.length<n&&guard++<60){ const t=wpick(w); if(t!=='combat'&&out.includes(t)) continue; out.push(t); }
  if(!out.includes('combat')&&!out.includes('elite')) out[0]='combat';
  out.forEach(t=>{ if(t!=='combat') G.seen[t]=f; });
  return out;
}
function nextFloor(){
  G.floor++; G.combat=null; G.reward=null; G.shop=null; G.event=null; G.treasure=null; G.pending=null;
  META.best=Math.max(META.best,G.floor); store('cripta-meta',META);
  G.doors=genDoors();
  if(worldOf().local===1&&G.floor>1){ saveRun(); const st=worldStory(); playStory(st.panels,()=>{ view='game'; go('map'); if(st.pact) showPacts(); },{endLabel:st.pact?'Tocar el Núcleo':'Seguir',final:st.final,music:'dungeon'}); }
  else go('map');
}
function go(s){ G.screen=s; view='game'; saveRun(); retrigger($('#wipe'),'on'); render(); }
function enterDoor(t,btn){
  sfx('door');
  if(btn){ btn.classList.add('open'); btn.querySelector('img').src=doorURL(t,true); }
  setTimeout(()=>{
    if(t==='combat') startCombat(pick(poolFor()),'normal');
    else if(t==='elite') startCombat(pick(worldOf().w.elites),'elite');
    else if(t==='boss') startCombat(worldOf().w.boss,'boss');
    else if(t==='treasure'){ const g=gainGold(rnd(25,45)),r=randomRelic(); gainRelic(r); G.treasure={gold:g,relic:r}; go('treasure'); }
    else if(t==='shop'){ genShop(); go('shop'); }
    else if(t==='rest') go('rest');
    else if(t==='event'){ G.event={id:pick(EVENTS).id,result:null,next:null}; go('event'); }
  },REDUCED?0:420);
}

/* ================= combat ================= */
function makeEnemy(key){
  const d=ENEMIES[key],f=G.floor,cy=worldOf().cycle,hp=d.boss?Math.round(d.hp*(1+.4*cy)):Math.round(d.hp*(1+.075*(f-1)));
  return {key,name:d.name,hp,maxHp:hp,block:0,str:d.boss?1+2*cy:Math.floor((f-1)/5),intent:null,last:null};
}
function pickIntent(e){
  const d=ENEMIES[e.key],opts=d.intents.filter(i=>!(e.last&&i[0]===e.last[0]&&i[0]!=='atk'));
  const it=pick(opts.length?opts:d.intents); e.last=it; e.intent={type:it[0],v:it[1],n:it[2]||1};
}
const intentVal=e=>['atk','multi','drain'].includes(e.intent.type)?e.intent.v+e.str+(G&&G.pact==='fury'?3:0):e.intent.v;
function intentText(e){
  const v=intentVal(e),n=e.intent.n;
  return {atk:`Atacará por ${v}`,multi:`${n} golpes de ${v}`,drain:`Absorberá ${v} de vida`,block:`Se protegerá con ${v}`,buff:`Se enfurece: +${v} de daño`,heal:`Se curará ${v}`,steal:`Quiere robarte ${v} de oro`}[e.intent.type];
}
function intentHTML(e){
  if(!e.intent) return '';
  const m={atk:['sword','atk'],multi:['sword','atk'],drain:['cup','crit'],block:['shield','def'],buff:['up','ember'],heal:['heart','heal'],steal:['coin','coin']}[e.intent.type];
  const v=intentVal(e),txt=e.intent.type==='multi'?`${e.intent.n}×${v}`:e.intent.type==='buff'?`+${v}`:v;
  return `<div class="bubble pf dark" style="--rim:${RC[m[1]]}">${icon(m[0],m[1],2)}<b>${txt}</b><span>${intentText(e)}</span></div>`;
}
function startCombat(key,kind){
  const e=makeEnemy(key); pickIntent(e);
  G.combat={enemy:e,kind,faces:G.dice.map(()=>null),held:G.dice.map(()=>false),rerolls:maxRerolls(),phase:'start',pBlock:(has('runic')?6:0)+gearBlock(),turn:1,
    log:kind==='boss'?`El suelo tiembla. ${e.name} despierta.`:kind==='elite'?`Cuidado: enemigo de élite.`:`Algo se mueve en la oscuridad.`};
  G.combat.buffs=takeBuffs(); if(G.pact==='luck') G.combat.buffs.luck=true; if(G.combat.buffs.ward) G.combat.pBlock+=3;
  go('combat');
  { const bn=BUFFK.filter(k=>G.combat.buffs[k]); if(bn.length&&kind!=='boss') setTimeout(()=>{ banner(bn.includes('luck')?'¡Suerte!':bn.includes('fury')?'¡Furia!':'¡Guardia!'); sfx('combo'); },350); }
  if(kind==='boss'){ banner(e.name); sfx('buff'); }
}
function calc(faces){
  const r={atk:0,def:0,heal:0,coin:0,crits:0,combos:[]},cnt={};
  faces.forEach(f=>{
    if(!f) return;
    if(f.t==='blank'){ if(has('loaded')) r.atk+=2; return; }
    const k=f.t==='crit'?'atk':f.t; cnt[k]=(cnt[k]||0)+1;
    if(f.t==='atk') r.atk+=f.v+(has('whet')?1:0);
    else if(f.t==='crit'){ r.atk+=f.v; r.crits++; }
    else r[f.t]+=f.v;
  });
  for(const k in cnt) if(cnt[k]>=3){ const bonus=(cnt[k]-2)*2*(has('idol')?2:1)*(G&&G.pact==='echo'?3:1); r[k]+=bonus; r.combos.push({t:k,n:cnt[k],bonus}); }
  { const C0=G&&G.combat; if(C0&&C0.buffs&&C0.buffs.fury&&r.atk>0) r.atk+=3; }
  { const gd=gearTotal().dmg||0; if(gd&&r.atk>0) r.atk+=gd; }
  if(G&&G.pact==='fury'&&r.atk>0) r.atk+=4;
  if(G&&G.pact==='iron') r.heal=0;
  r.dmg=r.atk*(r.crits?2:1);
  if(has('purse')) r.coin=Math.round(r.coin*1.5);
  return r;
}
function renderCombat(){
  const C=G.combat,e=C.enemy;
  M.innerHTML=`<section class="combat">
    <div class="cl">
      <div class="intent-row" id="intent"></div>
      <div class="foe-spot" id="spot"></div>
      <div class="plate pf dark"><span class="nm">${e.name}</span>
        <div class="bar" id="foeBar"><i id="foeHp"></i><span id="foeHpT"></span><em class="eblock" id="eblock" hidden data-tip="<b style=&quot;color:#3fb0c9&quot;>Escudo enemigo</b>Absorbe tu daño antes de tocarle la vida. Desaparece cuando vuelve a actuar."></em><em class="epoison" id="epoison" hidden data-tip="<b style=&quot;color:#5fb843&quot;>Veneno</b>Al empezar su turno pierde tanta vida como veneno tenga, y el veneno baja 1."></em></div></div>
    </div>
    <div class="cr">
      <p class="log" id="log"></p>
      <div class="sum" id="sum"></div>
      <div class="tray" id="tray"><button class="lockall" id="bLockAll" disabled></button>${G.dice.map((_,i)=>`<button class="die" id="die${i}" data-i="${i}" aria-label="Dado ${i+1}"></button>`).join('')}</div>
      <div class="actions" id="actions"></div>
    </div>
  </section>`;
  const tray=$('#tray');
  fitTray();
  tray.querySelectorAll('.die').forEach(b=>b.onclick=()=>toggleHold(+b.dataset.i));
  updateCombat();
}
function fitTray(){
  const tray=$('#tray'); if(!tray||!G) return;
  const n=G.dice.length,tw=tray.clientWidth-30,low=innerHeight<560&&innerWidth>innerHeight;
  let k=low?2:(innerHeight>=740?4:3);
  while(k>2&&n*22*k+(n-1)*10>tw) k--;
  tray.style.setProperty('--dk',k);
}
function setDie(i,force){
  const C=G.combat,el=$('#die'+i); if(!el) return;
  const f=C.faces[i],key=f?`${f.t}${f.v}${f.rar}`:'none';
  if(force||el.dataset.k!==key){ el.dataset.k=key; el.innerHTML=dieImg(f)+'<span class="lock">FIJO</span>'; }
  el.classList.toggle('held',!!C.held[i]);
}
function updateCombat(){
  const C=G.combat; if(!C||G.screen!=='combat'||!$('#foeHp')) return;
  const e=C.enemy;
  $('#foeHp').style.width=`calc((100% - 6px) * ${Math.max(0,e.hp)/e.maxHp})`;
  $('#foeHpT').textContent=`${Math.max(0,e.hp)} / ${e.maxHp}`;
  const eb=$('#eblock'); eb.hidden=!e.block; eb.innerHTML=icon('shield','def',1)+e.block;
  const ep=$('#epoison'); ep.hidden=!e.poison; ep.innerHTML=icon('skull','heal',1)+(e.poison||0);
  $('#intent').innerHTML=C.phase==='won'?'':intentHTML(e);
  G.dice.forEach((_,i)=>{ if(!$('#die'+i).classList.contains('rolling')) setDie(i); });
  $('#sum').innerHTML=sumHTML();
  $('#log').textContent=C.log||'';
  updateLockAll(); updateActions(); updateTop();
}
function sumHTML(){
  const C=G.combat;
  if(!C.faces.some(Boolean)) return `<span class="hint">Turno ${C.turn}: tira los dados</span>`;
  const r=calc(C.faces);
  const chip=(t,v,extra='')=>`<span class="chip pf dark" style="--rim:${RC[t]}">${icon(TYPES[t].icon,t,2)}<b>${v}</b>${extra}</span>`;
  let s='';
  if(r.dmg) s+=chip('atk',r.dmg,r.crits?'<i>×2</i>':'');
  if(r.def) s+=chip('def',r.def);
  if(r.heal) s+=chip('heal',r.heal);
  if(r.coin) s+=chip('coin',r.coin);
  if(r.combos.length) s+=`<span class="chip combo pf dark">Racha +${r.combos.reduce((a,c)=>a+c.bonus,0)}</span>`;
  return s||'<span class="hint">Nada útil. ¡Relanza!</span>';
}
function updateActions(){
  const C=G.combat,a=$('#actions'); if(!a) return;
  const busy=C.phase!=='start'&&C.phase!=='rolled';
  if(C.phase==='start'){
    a.innerHTML=`<button class="pb go big" id="bRoll">${icon('dice','bone',2)} Tirar dados</button>`;
    $('#bRoll').onclick=roll;
  } else if(C.faces.some(Boolean)){
    const allHeld=C.held.every(Boolean),mx=maxRerolls();
    const pips=Array.from({length:mx},(_,i)=>`<span class="${i<C.rerolls?'':'off'}"></span>`).join('');
    a.innerHTML=`<button class="pb" id="bRe" ${busy||!C.rerolls||allHeld?'disabled':''}>Relanzar <span class="pips">${pips}</span></button>
      <button class="pb go" id="bGo" ${busy?'disabled':''}>${icon('sword','atk',2)} Resolver</button>`;
    $('#bRe').onclick=roll; $('#bGo').onclick=resolve;
  } else a.innerHTML=`<button class="pb go big" disabled>Tirando…</button>`;
}
function updateLockAll(){
  const C=G.combat,b=$('#bLockAll'); if(!b) return;
  const all=C.faces.some(Boolean)&&C.held.every(Boolean);
  b.disabled=C.phase!=='rolled';
  b.innerHTML=all?`${icon('unlock','bone',1)} Soltar todo`:`${icon('lock','bone',1)} Fijar todo`;
  b.setAttribute('aria-label',all?'Soltar todos los dados':'Fijar todos los dados');
  b.onclick=lockAll;
}
function lockAll(){
  const C=G.combat; if(C.phase!=='rolled') return;
  const all=C.held.every(Boolean);
  C.held=C.faces.map(f=>!all&&!!f);
  sfx(all?'tap':'block'); buzz(12);
  G.dice.forEach((_,i)=>{ const el=$('#die'+i); if(el&&!all) retrigger(el,'land'); });
  updateCombat();
}
function toggleHold(i){
  const C=G.combat; if(C.phase!=='rolled'||!C.faces[i]) return;
  C.held[i]=!C.held[i]; sfx('tap'); buzz(8); updateCombat();
}
function animateDie(i,k){
  return new Promise(res=>{
    const C=G.combat,el=$('#die'+i),faces=G.dice[i].faces;
    el.classList.remove('land','pop','held'); el.classList.add('rolling');
    const tick=setInterval(()=>{ el.innerHTML=dieImg(pick(faces))+'<span class="lock">FIJO</span>'; },75);
    setTimeout(()=>{
      clearInterval(tick);
      let pf=pick(faces),lucky=false;
      if(C.buffs&&C.buffs.luck){ const alt=pick(faces); if(faceScore(alt)>faceScore(pf)){ pf=alt; lucky=true; } }
      C.faces[i]={...pf};
      if(lucky) setTimeout(()=>burstAt(el,'heal',12,1.6),20);
      el.classList.remove('rolling'); setDie(i,true); retrigger(el,'land');
      sfx('clack'); buzz(12);
      const f=C.faces[i];
      if(SKINS[SKIN].fx) burstAt(el,SKINS[SKIN].fx,SKIN==='obsidian'?16:12,1.8);
      if(f.t==='crit'){ burstAt(el,'crit',22,2.4); G.stats.crits++; }
      else if(f.rar==='epic') burstAt(el,'epic',14,2);
      res();
    },REDUCED?120:520+k*140);
  });
}
async function roll(){
  const C=G.combat;
  if(C.phase==='rolled'){ if(C.rerolls<=0) return; }
  else if(C.phase!=='start') return;
  const first=C.phase==='start',idx=G.dice.map((_,i)=>i).filter(i=>!C.held[i]);
  if(!idx.length) return;
  if(!first) C.rerolls--;
  C.phase='rolling'; updateActions(); sfx('roll'); G.stats.rolls++;
  await Promise.all(idx.map((i,k)=>animateDie(i,k)));
  if(first&&has('eye')){
    const bl=idx.filter(i=>C.faces[i].t==='blank');
    if(bl.length){ toast(`<b>Ojo del augur</b>: relanza ${bl.length===1?'una cara vacía':bl.length+' caras vacías'}`); await wait(250); await Promise.all(bl.map((i,k)=>animateDie(i,k))); }
  }
  C.phase='rolled';
  if(SKIN==='celestial'&&Math.random()<.22) setTimeout(shootingStar,300);
  C.log=C.rerolls?'Toca un dado para fijarlo y relanza el resto.':'Sin relanzamientos. Resuelve la tirada.';
  saveRun(); updateCombat();
}
async function resolve(){
  const C=G.combat; if(C.phase!=='rolled') return;
  C.phase='resolving'; C.held=C.held.map(()=>false); updateCombat();
  const e=C.enemy,r=calc(C.faces);
  for(let i=0;i<G.dice.length;i++){ retrigger($('#die'+i),'pop'); await wait(REDUCED?0:80); }
  if(r.combos.length){ banner(`¡Racha ×${Math.max(...r.combos.map(c=>c.n))}!`); sfx('combo'); buzz([20,40,20]); await wait(650); }
  let any=false;
  if(r.heal){ const h=heal(r.heal); floatAt('#hpBar',`+${h}`,'heal'); burstAt('#hpBar','heal',14,2); sfx('heal'); any=true; }
  if(r.def){ C.pBlock+=r.def; updateTop(); floatAt('#pblock',`+${r.def}`,'def'); sfx('block'); any=true; }
  if(r.coin){ G.gold+=r.coin; floatAt('#goldS',`+${r.coin}`,'coin'); burstAt('#goldS','coin',12,2); sfx('coin'); any=true; }
  if(r.crits&&has('vamp')){ const h=heal(3); if(h) floatAt('#hpBar',`+${h}`,'heal'); }
  updateTop(); if(any) await wait(450);
  if(r.dmg>0){
    const perk=await throwSwords(r),total=r.dmg+perk.bonus,hadBlock=e.block;
    const blocked=perk.pierce?0:Math.min(e.block,total),dealt=total-blocked;
    e.block-=blocked; e.hp-=dealt; G.stats.dmg+=dealt;
    if(G.pact==='blood'&&dealt>0){ const h=heal(2); if(h) setTimeout(()=>floatAt('#hpBar',`+${h}`,'heal'),200); }
    if(S.foe){ S.foe.flash=1; S.foe.shake=r.crits?7:4; }
    if(r.crits){ banner('¡Ataque mágico!'); sfx('crit'); shake(); buzz([30,30,60]); burstFoe('crit',40,3.2); }
    else { sfx('hit'); buzz(25); }
    burstFoe('atk',dealt>=12?36:20,dealt>=12?3:2.2);
    if(dealt>0) floatAt(foePt(),`-${dealt}`,r.crits||dealt>=15?'big':'dmg');
    if(blocked) setTimeout(()=>floatAt('#foeBar',`${blocked} bloqueado`,'small'),150);
    C.log=dealt?`Le haces ${dealt} de daño.${perk.pierce&&hadBlock?' Tus espadas atraviesan su escudo.':''}`:'Su escudo absorbe todo el golpe.';
    updateCombat(); await wait(650);
  }
  if(e.hp<=0) return winCombat();
  C.phase='enemy'; updateActions();
  await wait(250);
  await enemyTurn();
  if(G.hp<=0&&!phoenix()) return lose();
  if(e.hp<=0) return winCombat();
  newTurn();
}
async function hitPlayer(d){
  { const gt=gearTotal(); if(gt.dodge&&Math.random()*100<gt.dodge){ floatAt('#hpBar','¡Esquiva!','def'); sfx('whoosh'); if(gt.dodgeHeal){ const h=heal(gt.dodgeHeal); if(h) setTimeout(()=>floatAt('#hpBar',`+${h}`,'heal'),250); } updateCombat(); return 0; } }
  const C=G.combat,e=C.enemy,b=Math.min(C.pBlock,d),dmg=d-b;
  C.pBlock-=b;
  if(dmg>0){ G.hp=Math.max(0,G.hp-dmg); redFlash(); shake(); sfx('hurt'); buzz(80); floatAt('#hpBar',`-${dmg}`,'dmg'); }
  else { sfx('block'); floatAt('#hpBar','Bloqueado','def'); }
  const th=(has('thorns')?3:0)+(gearTotal().thorns||0);
  if(th&&e.hp>0){ e.hp-=th; if(S.foe) S.foe.flash=.6; setTimeout(()=>floatAt(foePt(),`-${th}`,'small'),200); }
  updateCombat();
  return dmg;
}
async function enemyTurn(){
  const C=G.combat,e=C.enemy,it=e.intent,lunge=()=>{ if(S.foe) S.foe.lunge=1; };
  if(e.poison>0){ const pd=e.poison; e.hp-=pd; e.poison--; floatAt(foePt(),`-${pd} veneno`,'heal'); burstFoe('heal',16,1.6); sfx('sizzle'); C.log=`El veneno le quita ${pd}.`; updateCombat(); await wait(500); if(e.hp<=0) return; }
  e.block=0; updateCombat();
  lunge(); await wait(200);
  const v=intentVal(e);
  if(it.type==='atk'){ const d=await hitPlayer(v); C.log=d?`${e.name} te golpea por ${d}.`:'Bloqueas el ataque entero.'; }
  else if(it.type==='multi'){ let tot=0; for(let k=0;k<it.n&&G.hp>0;k++){ tot+=await hitPlayer(v); await wait(300); if(k<it.n-1) lunge(); } C.log=`Recibes ${tot} de daño en ${it.n} golpes.`; }
  else if(it.type==='drain'){ const d=await hitPlayer(v),h=Math.min(e.maxHp-e.hp,d); e.hp+=h; if(h) floatAt(foePt(),`+${h}`,'heal'); C.log=d?`Te absorbe ${d} de vida.`:'Tu escudo lo detiene.'; }
  else if(it.type==='block'){ e.block+=v; sfx('block'); floatAt(foePt(),`+${v}`,'def'); burstFoe('def',14,1.6); C.log=`${e.name} se protege con ${v} de escudo.`; }
  else if(it.type==='buff'){ e.str+=v; sfx('buff'); floatAt(foePt(),`+${v} furia`,'dmg'); burstFoe('ember',22,2); C.log=`${e.name} se enfurece. Sus ataques hacen +${v}.`; }
  else if(it.type==='heal'){ const h=Math.min(e.maxHp-e.hp,v); e.hp+=h; sfx('heal'); floatAt(foePt(),`+${h}`,'heal'); burstFoe('heal',14,1.6); C.log=`${e.name} se cura ${h}.`; }
  else if(it.type==='steal'){ const s=Math.min(G.gold,v); G.gold-=s; floatAt('#goldS',`-${s}`,'coin'); sfx('coin'); C.log=s?`Te roba ${s} de oro.`:'Intenta robarte, pero no tienes oro.'; }
  updateCombat(); await wait(550);
}
function newTurn(){
  const C=G.combat;
  C.turn++; C.pBlock=gearBlock()+(C.buffs&&C.buffs.ward?3:0);
  { const rg=gearTotal().regen||0; if(rg&&G.hp<G.maxHp){ const h=heal(rg); if(h) setTimeout(()=>floatAt('#hpBar',`+${h}`,'heal'),120); } } C.faces=G.dice.map(()=>null); C.held=G.dice.map(()=>false);
  C.rerolls=maxRerolls(); C.phase='start'; pickIntent(C.enemy);
  saveRun(); updateCombat();
}
async function winCombat(){
  const C=G.combat,e=C.enemy;
  C.phase='won'; updateCombat();
  if(S.foe){ S.foe.flash=0; S.foe.dead=.01; }
  sfx('die'); burstFoe('ember',60,3.5); burstFoe('bone',30,2.5); buzz([40,40,80]);
  G.stats.kills++;
  { const wh=gearTotal().winHeal; if(wh){ const h=heal(wh); if(h) floatAt('#hpBar',`+${h}`,'heal'); } }
  await wait(900);
  if(C.kind==='boss'){ banner('¡Jefe vencido!'); sfx('win'); META.wins++; store('cripta-meta',META); await wait(900); }
  sfx('win');
  const big=C.kind!=='normal',gold=gainGold(C.kind==='boss'?rnd(60,80):big?rnd(28,40):rnd(9,16));
  let relic=null; if(big){ relic=randomRelic(); gainRelic(relic); }
  const b=big?1:0,opts=[{kind:'face',face:genFace(b)},{kind:'face',face:genFace(b)}];
  if(G.dice.length<5&&Math.random()<.4) opts[1]={kind:'die',die:genDie()};
  opts.push({kind:'bless',b:pick(Object.keys(BLESS).filter(k=>k!=='heal'||G.hp<G.maxHp*.8))});
  G.reward={title:`${e.name} derrotado`,gold,relic,opts,stage:'box',box:Math.random()<BOX_CHANCE?{open:false}:null};
  go('reward');
}
function bankRun(won){ const earned=G.gold+G.floor*15+G.stats.kills*8+(won?500:0); META.bank=(META.bank||0)+earned; store('cripta-meta',META); G.earned=earned; }
function lose(){
  G.combat.phase='lost'; sfx('lose'); bankRun(false); G.over=true; drop('cripta-run');
  META.best=Math.max(META.best,G.floor); store('cripta-meta',META);
  setTimeout(()=>{ G.screen='gameover'; retrigger($('#wipe'),'on'); render(); },900);
}
function victory(){
  bankRun(true); G.over=true; drop('cripta-run'); META.best=Math.max(META.best,G.floor); store('cripta-meta',META);
  G.screen='victory'; retrigger($('#wipe'),'on'); render();
}

function finishPending(){ const back=G.pending&&G.pending.back; G.pending=null; if(back==='shop') go('shop'); else nextFloor(); }
function genShop(){
  const priceOf=f=>({common:rnd(26,32),rare:rnd(42,50),epic:rnd(66,76)})[f.rar],items=[];
  for(let i=0;i<2;i++){ const f=genFace(.5); items.push({kind:'face',face:f,price:priceOf(f)}); }
  const r=randomRelic(); if(r) items.push({kind:'relic',relic:r,price:rnd(68,82)});
  items.push({kind:'potion',heal:12,price:18});
  items.push({kind:'bless',b:pick(BUFFK),price:rnd(30,40)});
  if(G.dice.length<5) items.push({kind:'die',die:genDie(),price:rnd(80,95)});
  else { const f=genFace(1); items.push({kind:'face',face:f,price:priceOf(f)}); }
  if(G.pact==='gold') items.forEach(it=>it.price*=2);
  G.shop={items};
}

function wareCard(it,i){

];

$('#hpIc').innerHTML=icon('heart','atk',2); $('#pbIc').innerHTML=icon('shield','def',2); $('#gIc').innerHTML=icon('coin','coin',2);
function updateTop(){
  const show=!!(G&&view==='game'&&!['gameover','victory'].includes(G.screen));
  $('#hud').hidden=!show; const bf=show?buffList():[]; $('#relics').hidden=!show||(!G.relics.length&&!bf.length&&!G.pact);
  if(!show) return;

  const pb=G.screen==='combat'&&G.combat?G.combat.pBlock:0;
  $('#pblock').hidden=!pb; $('#pblockT').textContent=pb;
  const rk=G.relics.join()+'|'+bf.map(b=>b.k+b.act+b.pend).join()+'|'+(G.pact||'');
  if($('#relics').dataset.k!==rk){ $('#relics').dataset.k=rk; $('#relics').innerHTML=G.relics.map(r=>`<button class="relic" data-r="${r}" style="--rc:${RC[RELICS[r].rk]}" aria-label="${RELICS[r].name}">${icon(RELICS[r].icon,RELICS[r].rk,2)}</button>`).join('')+bf.map(b=>`<button class="relic buff ${b.act?'act':''}" data-b="${b.k}" data-act="${b.act?1:0}" aria-label="${BLESS[b.k].name}">${icon(BLESS[b.k].icon,BLESS[b.k].rk,2)}${!b.act&&b.pend>0?`<i>${b.pend}</i>`:''}</button>`).join('')+pactBadge(); }
}
/* ---- tooltips: tap on mobile, hover on desktop ---- */
const TIP=document.createElement('div'); TIP.id='tip'; TIP.className='pf dark'; TIP.hidden=true; TIP.setAttribute('role','tooltip'); document.body.appendChild(TIP);
let tipT=null;
function tipHTML(el){
  if(el.dataset.b){
    const B=BLESS[el.dataset.b],act=el.dataset.act==='1',n=(G&&G.buffs&&G.buffs[el.dataset.b])||0;
    const st=act?(n?`Activa en esta pelea · ${n} más en espera`:'Activa en esta pelea'):(n===1?'Para tu próxima pelea':`Para tus próximas ${n} peleas`);
    return `<b style="color:${RC[B.rk]}">${B.name}</b>${B.desc}<span class="st" style="color:${act?'var(--yel)':'var(--grn3)'}">${st}</span>`;
  }
  if(el.dataset.r){ const R=RELICS[el.dataset.r]; return `<b style="color:${RC[R.rk]}">${R.name}</b>${R.desc}<span class="st" style="color:var(--st3)">Reliquia · dura toda la partida</span>`; }
  return el.dataset.tip||'';
}
function showTip(el){
  const html=tipHTML(el); if(!html) return;
  TIP.innerHTML=html; TIP.hidden=false; TIP._el=el;
  const r=el.getBoundingClientRect(),tw=TIP.offsetWidth,th=TIP.offsetHeight;
  const x=Math.max(8,Math.min(innerWidth-tw-8,r.left+r.width/2-tw/2));
  let y=r.bottom+10; if(y+th>innerHeight-8) y=r.top-th-10;
  TIP.style.left=x+'px'; TIP.style.top=Math.max(8,y)+'px';
  clearTimeout(tipT); tipT=setTimeout(hideTip,4500);
}
function hideTip(){ TIP.hidden=true; TIP._el=null; clearTimeout(tipT); }
const TIPSEL='[data-tip],.relic';
document.addEventListener('click',e=>{ const t=e.target.closest(TIPSEL); if(!t) return; if(!TIP.hidden&&TIP._el===t) hideTip(); else { showTip(t); sfx('tap'); } });
document.addEventListener('pointerover',e=>{ if(e.pointerType!=='mouse') return; const t=e.target.closest(TIPSEL); if(t&&TIP._el!==t) showTip(t); });
document.addEventListener('pointerout',e=>{ if(e.pointerType!=='mouse') return; const t=e.target.closest(TIPSEL); if(t&&!(e.relatedTarget&&t.contains(e.relatedTarget))) hideTip(); });
document.addEventListener('pointerdown',e=>{ if(!e.target.closest(TIPSEL+',#tip')) hideTip(); },true);

function normalize(){
  const C=G.combat;
  if(G.screen==='combat'&&C&&!['start','rolled'].includes(C.phase)){
    C.enemy.hp=Math.max(1,C.enemy.hp); G.hp=Math.max(1,G.hp);
    C.phase='start'; C.faces=G.dice.map(()=>null); C.held=G.dice.map(()=>false); C.rerolls=maxRerolls();
  }
}
function sceneFor(){
  if(!G||view==='title') return ['title',{}];
  const k=G.combat&&G.combat.kind,co=k==='boss'?{boss:1}:k==='elite'?{elite:1}:{};
  switch(G.screen){
    case 'map': return ['hall',{theme:worldOf().w.key}];
    case 'combat': case 'reward': return [worldOf().w.scene,co];
    case 'shop': return ['shop',{}];
    case 'rest': return ['rest',{}];
    case 'forge': return G.pending&&G.pending.back==='shop'?['shop',{}]:G.pending&&G.pending.mode==='upgrade'?['rest',{}]:['crypt',co];
    case 'treasure': return ['treasure',{}];
    case 'event': { const ev=EVENTS.find(e=>e.id===G.event.id); return ['event',{icon:ev.art,ramp:ev.ramp}]; }
    case 'gameover': return [worldOf().w.scene,{dim:1}];
    case 'victory': return ['title',{dawn:1}];
  }
  return ['crypt',co];
}
function render(){
  $('#sheet').hidden=true; hideTip(); { const lm=$('#lootModal'); if(lm) lm.hidden=true; }
  if(!G||view==='title') renderTitle();
  else ({map:renderMap,combat:renderCombat,reward:renderReward,forge:renderForge,shop:renderShop,rest:renderRest,treasure:renderTreasure,event:renderEvent,gameover:()=>renderEnd(false),victory:()=>renderEnd(true)}[G.screen]||renderMap)();
  M.scrollTop=0; updateTop();
  if(G&&view==='game'&&G.screen==='combat'){ const d=ENEMIES[G.combat.enemy.key]; S.foe=Object.assign({},procSprite(d.sprite,d.pal),{flash:0,shake:0,lunge:0,dead:G.combat.phase==='won'?1:0,boss:!!d.boss,elite:!!d.elite,sc:2}); }
  else S.foe=null;
  const [name,opt]=sceneFor(); setScene(name,opt);
  setMusic(trackFor());
}

sizeCanvases();
